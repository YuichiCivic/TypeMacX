<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<h2>インストールが終わりました</h2>
<p>最後に、入力ソースに TypeMacX を追加してください。</p>
<ol>
<li>システム設定 → <b>キーボード</b> → 入力ソースの「<b>編集…</b>」</li>
<li>左下の「<b>+</b>」→ <b>日本語</b> → <b>TypeMacX</b> → 「追加」</li>
<li>メニューバーの入力メニュー (または Control + Space) で TypeMacX を選ぶ</li>
</ol>
<p>「+」の一覧に出てこないときは、いったんログアウトしてログインし直してください。</p>
</body></html>
