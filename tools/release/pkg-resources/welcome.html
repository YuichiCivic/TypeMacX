<h2>TypeMacX へようこそ</h2>
<p>TypeMacX は、日本語入力を切り替えずに日本語と英語を混ぜて打てる入力ソースです。</p>
<p><code>kyouhagoogledekensaku</code> → <b>今日はgoogleで検索</b></p>
<ul>
<li>入力した文字はすべてこの Mac の中だけで処理し、外部に送りません。</li>
<li>Xcode・VS Code・ターミナルでは、コードは英語のまま、コメントは日本語になります。</li>
</ul>
<p>TypeMacX は <a href="https://github.com/yksr-melt/Meltype">Meltype</a> (雪代 / Yukishiro) をもとにした、GNU GPL v3 のフリーソフトウェアです。</p>
