name: 改善の提案
description: こうなったら使いやすい、という提案
title: "[提案] "
labels: ["提案"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。今は不具合の修正と判定・変換の精度を優先しているため、すぐには入れられないことがあります。

  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どんな場面で、何が不便か
      placeholder: Discord で絵文字を打つとき、毎回 : を打つのが面倒
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: こうなってほしい
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      multiple: true
      options:
        - Windows
        - Mac
        - Linux
